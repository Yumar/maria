services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maria
      POSTGRES_USER: maria
      POSTGRES_PASSWORD: maria
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maria -d maria"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
